
name: Gaming Shorts Automator

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube video URL'
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Update yt-dlp
        run: |
          python -m pip install --upgrade yt-dlp

      - name: Run automation
        env:
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
          CLIP_COUNT: '20'
        run: |
          echo "Checking YouTube URL..."
          if [ -z "$INPUT_VIDEO_URL" ]; then
            echo "ERROR: No video URL supplied."
            exit 1
          fi
          echo "Starting Gaming Shorts Automator..."
          python main.py

      - name: Upload generated clips
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaming-shorts-clips
          path: |
            clips/
            output/
          if-no-files-found: warn
          retention-days: 7
